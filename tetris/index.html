<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Tetris</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-bottom: 20px;
        }
        canvas {
            background-color: #111;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            border: 2px solid #555;
        }
        #ui-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel-box {
            background-color: #111;
            border: 2px solid #555;
            padding: 10px;
            width: 120px;
            text-align: center;
        }
        .panel-box h3 { margin: 0 0 10px 0; font-size: 16px; color: #aaa; }
        .panel-box p { margin: 0; font-size: 20px; font-weight: bold; }
        
        #controls-pad {
            display: none;
            width: 100%;
            max-width: 400px;
            user-select: none;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }
        .btn {
            background-color: rgba(255,255,255,0.2);
            border: 1px solid #777;
            border-radius: 10px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .btn:active { background-color: rgba(255,255,255,0.4); }
        .empty { visibility: hidden; }

        @media (max-width: 600px) {
            #game-container { flex-direction: column; align-items: center; gap: 10px; margin-bottom: 10px; }
            #ui-panel { flex-direction: row; justify-content: center; }
            .panel-box { width: 80px; padding: 5px; }
            .panel-box h3 { font-size: 12px; }
            .panel-box p { font-size: 16px; }
            #controls-pad { display: flex; flex-direction: column; gap: 10px; padding: 0 10px; }
            canvas#board { height: 50vh; width: auto; }
            canvas#next { height: 60px; width: 60px; }
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #overlay h1 { font-size: 40px; margin-bottom: 20px; color: #0ff; text-shadow: 2px 2px #f0f; }
        #start-btn {
            padding: 15px 30px; font-size: 20px; background: #0f0; color: #000;
            border: none; cursor: pointer; font-family: inherit; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="overlay">
    <h1 id="title-text">TETRIS</h1>
    <button id="start-btn">START GAME</button>
</div>

<div id="game-container">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="ui-panel">
        <div class="panel-box">
            <h3>NEXT</h3>
            <canvas id="next" width="120" height="120"></canvas>
        </div>
        <div class="panel-box">
            <h3>SCORE</h3>
            <p id="score-val">0</p>
        </div>
        <div class="panel-box">
            <h3>LEVEL</h3>
            <p id="level-val">1</p>
        </div>
        <div class="panel-box">
            <h3>LINES</h3>
            <p id="lines-val">0</p>
        </div>
    </div>
</div>

<div id="controls-pad">
    <div class="d-pad">
        <div class="btn empty"></div>
        <div class="btn" id="btn-up">↻</div>
        <div class="btn empty"></div>
        <div class="btn" id="btn-left">←</div>
        <div class="btn" id="btn-down">↓</div>
        <div class="btn" id="btn-right">→</div>
    </div>
    <div class="btn" id="btn-drop" style="margin-top:10px; width:100%;">HARD DROP</div>
</div>

<script>
// --- Audio Engine ---
const AudioEngine = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },
    playTone(freq, type, duration, vol=0.1, slideFreq=null) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    move() { this.playTone(400, 'sine', 0.05, 0.05); },
    rotate() { this.playTone(600, 'square', 0.05, 0.05); },
    drop() { this.playTone(200, 'square', 0.1, 0.1, 50); },
    lock() { this.playTone(150, 'triangle', 0.15, 0.1); },
    clear(lines) {
        if (lines === 4) {
            this.playTone(440, 'square', 0.1, 0.1);
            setTimeout(()=>this.playTone(554, 'square', 0.1, 0.1), 100);
            setTimeout(()=>this.playTone(659, 'square', 0.2, 0.1), 200);
            setTimeout(()=>this.playTone(880, 'square', 0.4, 0.1), 300);
        } else {
            this.playTone(523.25, 'square', 0.1, 0.1);
            setTimeout(()=>this.playTone(659.25, 'square', 0.2, 0.1), 100);
        }
    },
    gameover() {
        this.playTone(300, 'sawtooth', 0.5, 0.2, 50);
    }
};

// --- Game Constants & Shapes ---
const COLS = 10, ROWS = 20, BLOCK_SIZE = 30;
const SHAPES = [
    null, // 0 is empty
    [[1,1,1,1]], // I
    [[2,0,0],[2,2,2]], // J
    [[0,0,3],[3,3,3]], // L
    [[4,4],[4,4]], // O
    [[0,5,5],[5,5,0]], // S
    [[0,6,0],[6,6,6]], // T
    [[7,7,0],[0,7,7]]  // Z
];
const COLORS = [
    null, '#00FFFF', '#0000FF', '#FFA500', '#FFFF00', '#00FF00', '#800080', '#FF0000'
];

// --- Tetromino Class ---
class Tetromino {
    constructor(typeId) {
        this.type = typeId;
        // Deep copy shape
        this.matrix = SHAPES[typeId].map(row => [...row]);
        this.color = COLORS[typeId];
        this.x = Math.floor(COLS / 2) - Math.floor(this.matrix[0].length / 2);
        this.y = 0;
    }
    
    rotate() {
        const N = this.matrix.length;
        const M = this.matrix[0].length;
        let newMatrix = [];
        for(let i=0; i<M; i++){
            newMatrix.push(new Array(N).fill(0));
        }
        for (let r = 0; r < N; r++) {
            for (let c = 0; c < M; c++) {
                newMatrix[c][N - 1 - r] = this.matrix[r][c];
            }
        }
        const prevMatrix = this.matrix;
        this.matrix = newMatrix;
        if (Game.checkCollision(0, 0, this)) {
            // Simple Kick: try left, right, up
            if (!Game.checkCollision(-1, 0, this)) { this.x--; }
            else if (!Game.checkCollision(1, 0, this)) { this.x++; }
            else if (!Game.checkCollision(0, -1, this)) { this.y--; }
            else { this.matrix = prevMatrix; } // Revert
        } else {
            AudioEngine.rotate();
        }
    }
}

// --- Main Game Object ---
const Game = {
    canvas: document.getElementById('board'),
    ctx: null,
    nextCtx: document.getElementById('next').getContext('2d'),
    board: [],
    piece: null,
    nextPieceType: null,
    score: 0, level: 1, lines: 0,
    dropCounter: 0,
    dropInterval: 1000,
    lastTime: 0,
    state: 'INTRO', // INTRO, PLAYING, GAMEOVER
    reqId: null,

    init() {
        this.ctx = this.canvas.getContext('2d');
        this.reset();
        this.bindEvents();
        requestAnimationFrame(this.loop.bind(this));
    },

    reset() {
        this.board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        this.score = 0; this.level = 1; this.lines = 0;
        this.updateUI();
        this.nextPieceType = Math.floor(Math.random() * 7) + 1;
        this.spawn();
    },

    spawn() {
        this.piece = new Tetromino(this.nextPieceType);
        this.nextPieceType = Math.floor(Math.random() * 7) + 1;
        this.drawNext();
        if (this.checkCollision(0, 0, this.piece)) {
            this.state = 'GAMEOVER';
            AudioEngine.gameover();
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('title-text').innerText = 'GAME OVER';
            document.getElementById('title-text').style.color = '#f00';
            document.getElementById('start-btn').innerText = 'RESTART';
        }
        this.dropCounter = 0;
    },

    checkCollision(dx, dy, pieceObj = this.piece) {
        const matrix = pieceObj.matrix;
        for (let r = 0; r < matrix.length; r++) {
            for (let c = 0; c < matrix[r].length; c++) {
                if (matrix[r][c] !== 0) {
                    let nx = pieceObj.x + c + dx;
                    let ny = pieceObj.y + r + dy;
                    if (nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && this.board[ny][nx] !== 0)) {
                        return true;
                    }
                }
            }
        }
        return false;
    },

    move(dx) {
        if (this.state !== 'PLAYING') return;
        if (!this.checkCollision(dx, 0)) {
            this.piece.x += dx;
            AudioEngine.move();
        }
    },

    drop() {
        if (this.state !== 'PLAYING') return;
        if (!this.checkCollision(0, 1)) {
            this.piece.y++;
        } else {
            this.lock();
        }
        this.dropCounter = 0;
    },

    hardDrop() {
        if (this.state !== 'PLAYING') return;
        while (!this.checkCollision(0, 1)) {
            this.piece.y++;
        }
        this.lock();
    },

    lock() {
        AudioEngine.lock();
        const matrix = this.piece.matrix;
        for (let r = 0; r < matrix.length; r++) {
            for (let c = 0; c < matrix[r].length; c++) {
                if (matrix[r][c] !== 0) {
                    if (this.piece.y + r < 0) continue;
                    this.board[this.piece.y + r][this.piece.x + c] = this.piece.type;
                }
            }
        }
        this.clearLines();
        this.spawn();
    },

    clearLines() {
        let linesCleared = 0;
        outer: for (let r = ROWS - 1; r >= 0; r--) {
            for (let c = 0; c < COLS; c++) {
                if (this.board[r][c] === 0) continue outer;
            }
            this.board.splice(r, 1);
            this.board.unshift(Array(COLS).fill(0));
            linesCleared++;
            r++; // Check same row index again after splice
        }
        if (linesCleared > 0) {
            AudioEngine.clear(linesCleared);
            this.lines += linesCleared;
            const points = [0, 100, 300, 500, 800];
            this.score += points[linesCleared] * this.level;
            this.level = Math.floor(this.lines / 10) + 1;
            this.dropInterval = Math.max(100, 1000 - (this.level - 1) * 100);
            this.updateUI();
        }
    },

    updateUI() {
        document.getElementById('score-val').innerText = this.score;
        document.getElementById('level-val').innerText = this.level;
        document.getElementById('lines-val').innerText = this.lines;
    },

    drawRect(ctx, x, y, color, w=1, h=1, outline=false) {
        ctx.fillStyle = color;
        if (outline) {
            ctx.globalAlpha = 0.3;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, w * BLOCK_SIZE, h * BLOCK_SIZE);
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.strokeRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, w * BLOCK_SIZE - 2, h * BLOCK_SIZE - 2);
        } else {
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, w * BLOCK_SIZE, h * BLOCK_SIZE);
            ctx.strokeStyle = '#222';
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, w * BLOCK_SIZE, h * BLOCK_SIZE);
            // Inner highlight for retro feel
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, w * BLOCK_SIZE, 4);
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, 4, h * BLOCK_SIZE);
        }
    },

    drawNext() {
        this.nextCtx.fillStyle = '#111';
        this.nextCtx.fillRect(0, 0, 120, 120);
        const matrix = SHAPES[this.nextPieceType];
        const color = COLORS[this.nextPieceType];
        const offset = (120 / BLOCK_SIZE - matrix[0].length) / 2;
        const offsetY = (120 / BLOCK_SIZE - matrix.length) / 2;
        for (let r = 0; r < matrix.length; r++) {
            for (let c = 0; c < matrix[r].length; c++) {
                if (matrix[r][c]) {
                    this.drawRect(this.nextCtx, offset + c, offsetY + r, color);
                }
            }
        }
    },

    draw() {
        this.ctx.fillStyle = '#111';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw Board
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (this.board[r][c] !== 0) {
                    this.drawRect(this.ctx, c, r, COLORS[this.board[r][c]]);
                }
            }
        }

        if (this.state === 'PLAYING' && this.piece) {
            // Calculate Ghost
            let ghostY = this.piece.y;
            while (!this.checkCollision(0, ghostY - this.piece.y + 1)) {
                ghostY++;
            }
            // Draw Ghost
            for (let r = 0; r < this.piece.matrix.length; r++) {
                for (let c = 0; c < this.piece.matrix[r].length; c++) {
                    if (this.piece.matrix[r][c]) {
                        this.drawRect(this.ctx, this.piece.x + c, ghostY + r, this.piece.color, 1, 1, true);
                    }
                }
            }
            // Draw Active Piece
            for (let r = 0; r < this.piece.matrix.length; r++) {
                for (let c = 0; c < this.piece.matrix[r].length; c++) {
                    if (this.piece.matrix[r][c]) {
                        this.drawRect(this.ctx, this.piece.x + c, this.piece.y + r, this.piece.color);
                    }
                }
            }
        }
    },

    loop(time = 0) {
        const dt = time - this.lastTime;
        this.lastTime = time;

        if (this.state === 'PLAYING') {
            this.dropCounter += dt;
            if (this.dropCounter > this.dropInterval) {
                this.drop();
            }
        }
        
        this.draw();
        this.reqId = requestAnimationFrame(this.loop.bind(this));
    },

    bindEvents() {
        document.addEventListener('keydown', (e) => {
            if (this.state !== 'PLAYING') return;
            switch(e.code) {
                case 'ArrowLeft': this.move(-1); break;
                case 'ArrowRight': this.move(1); break;
                case 'ArrowDown': this.drop(); this.score++; this.updateUI(); break;
                case 'ArrowUp': 
                case 'KeyX': this.piece.rotate(); break;
                case 'Space': this.hardDrop(); break;
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            AudioEngine.init();
            document.getElementById('overlay').style.display = 'none';
            if(this.state === 'GAMEOVER') this.reset();
            this.state = 'PLAYING';
        });

        // Touch Virtual Pad
        document.getElementById('btn-left').addEventListener('pointerdown', (e)=>{e.preventDefault(); this.move(-1);});
        document.getElementById('btn-right').addEventListener('pointerdown', (e)=>{e.preventDefault(); this.move(1);});
        document.getElementById('btn-down').addEventListener('pointerdown', (e)=>{e.preventDefault(); this.drop(); this.score++; this.updateUI();});
        document.getElementById('btn-up').addEventListener('pointerdown', (e)=>{e.preventDefault(); this.piece.rotate();});
        document.getElementById('btn-drop').addEventListener('pointerdown', (e)=>{e.preventDefault(); this.hardDrop();});
    }
};

window.onload = () => Game.init();
</script>
</body>
</html>
